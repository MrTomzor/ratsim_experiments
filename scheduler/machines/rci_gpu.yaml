# RCI cluster (CTU) — AMD **GPU** node (g[01-12], 4x A100-SXM4-40GB).
#
# Use this for dreamer. For PPO or RecurrentPPO — neither of which needs a card
# — use `--machine rci`, which gets a much bigger CPU allocation (see that file).
#
#   sbatch -p amdgpu --gres=gpu:1 --cpus-per-task=31 --mem=100G \
#          rci_port_probes/scheduler_job.sbatch <exp>
#   # or by hand, inside a job:
#   export RATSIM_SCHEDULER_MACHINE=rci_gpu
#   python scheduler_run.py <exp>
#
# ---------------------------------------------------------------------------
# Why 31 threads, not 112.
#
# A GPU node has to be shared proportionately: g[01-10] allow 124 threads and
# have 4 A100s, so one GPU's fair share is 124/4 = 31 threads. Taking 112 with a
# single --gres=gpu:1 would strand three A100s that nobody else can schedule.
# That is the same reasoning as the 18-threads-per-V100 figure on the Intel GPU
# nodes (72 threads / 4 GPUs); see RCI_CLUSTER_PORT.md §0.55.
#
# ⚠️ At 31 threads this config runs **exactly one run at a time**. Both
# profiles below need cpu_slot 16, and 16 + 16 = 32 > 31, so a dreamer run
# leaves no room for the PPO run beside it. (An earlier version of this comment
# claimed "one GPU run plus one PPO run alongside" — that was off by one
# thread.) 31 is kept rather than rounded to 32 because it is the honest fair
# share: g[01-10] allow 124 threads across 4 A100s, and four users each taking
# 32 would not fit on the node.
#
# **For anything but a single run, use `rci_gpu2.yaml`** — 2 cards / 62 threads,
# which fits 2 dreamers plus a PPO alongside and is the configuration actually
# verified on hardware (§0.96). This file is the minimal single-card ask.
#
# ---------------------------------------------------------------------------
# Scaling to several GPUs in one job.
#
# The scheduler's GpuAllocator (scheduler/gpus.py) hands each child its own
# CUDA_VISIBLE_DEVICES, so N dreamers in one job now land on N distinct cards.
# Before it existed they all piled onto device 0, which is why this file used to
# pin gpu: 1 regardless of the allocation.
#
# To run N GPU jobs concurrently, all three have to move together:
#   --gres=gpu:N   --cpus-per-task=31*N   and   resources below: gpu: N,
#   cpu_slot: 31*N
# The scheduler takes the SMALLER of resources.gpu and the GPUs actually
# granted, so over-declaring here does not widen the allocation -- it just
# warns. Note cpu_slot binds too: at cpu_slot 31 only one 16-slot GPU run fits
# no matter what gpu: says.
#
# A whole g[01-10] node is 4 A100s and 124 threads = gpu: 4, cpu_slot: 124.
# Check the QOS ceiling first (§0.55: 8 GPUs on the *fast partitions, 6 on
# *long) and ask before taking a whole node.
#
# Partition note: the *fast partitions cap at 4h, which suits smoke tests only.
# Real experiments want `amdgpu` (1 day), `amdgpulong` (3 days) or
# `amdgpuextralong` (21 days) — and since checkpoints currently land only at
# stage boundaries, a run that outlives its wall-clock loses the current
# stage's progress.
#
# 🚫 Do NOT retarget this at the h200* partitions. The admin rule is to use
# those only at high utilisation, and one dreamer world model will not
# saturate one H200.
# ---------------------------------------------------------------------------

resources:
  gpu: 1
  cpu_slot: 31

# See rci_gpu2.yaml — same shape, one card's worth.
sbatch:
  mem: 100G
  partitions:
    fast: amdgpufast           # 4 h
    day: amdgpu                # 1 day
    long: amdgpulong           # 3 days
    extralong: amdgpuextralong # 21 days

method_profiles:
  ppo:
    needs:
      cpu_slot: 16
    args:
      # No GPU need: CPU beats GPU for a small MLP (per-step host<->device
      # transfer costs more than the forward pass saves), which also leaves the
      # A100 free for the dreamer run alongside.
      method.device: cpu

  recurrent_ppo:
    needs:
      cpu_slot: 16
    args:
      # No GPU need — see rci.yaml's recurrent_ppo profile for the measurement.
      # Kept here (rather than deleted) so a def mixing dreamer and
      # recurrent_ppo still validates against this file; it just runs the
      # RecurrentPPO seeds on the node's cores instead of the card.
      method.device: cpu

  dreamer:
    needs:
      gpu: 1
      cpu_slot: 16
    # Known unfixed leak (~6-8 KB/env-step in the train process); the scheduler
    # SIGTERMs and re-dispatches at this threshold. Keep --mem comfortably above
    # it or SLURM's own OOM killer gets there first and the run just dies.
    max_ram_gb: 30
    args:
      method.jax.platform: cuda
      # NO compute_dtype override -- keep dreamerv3's bfloat16 default.
      #
      # Measured on a V100 (sm_70), 10k-step run each, one variable changed:
      #   bfloat16 (default) -> exit 0, fps/train 2039.8, fps/policy 67.3
      #   float16            -> exit 1, TypeError: "Argument types differ from
      #                         the types for which this computation was compiled"
      #
      # This is the opposite of what "Volta has no native bf16" suggests. Volta
      # lacking bf16 *tensor cores* does not stop XLA emulating the dtype
      # correctly, and dreamerv3's graph evidently pins bfloat16 somewhere that
      # a float16 compute_dtype then contradicts. Don't "optimise" this back to
      # float16 without re-running that comparison. (The A100 has native
      # bfloat16, so it is doubly right there.)
