# GPU-box machine config — one GPU, ~20 threads (Broadwell-class virtualized).
#
# Activate via:
#   python scheduler_run.py <exp> --machine gpu_example
# or via shell:
#   export RATSIM_SCHEDULER_MACHINE=gpu_example
#
# `cpu_slot` is counted in THREADS. At the default n_envs=4 the sizing rule is
# ~4 threads per env, so one run wants 16 and a 20-thread box fits exactly one
# at a time — the earlier version of this file claimed three parallel PPOs, but
# that was written when n_envs was 1. A box this size does not have the cores
# to pack runs; that needs a machine like rci.yaml.
#
# recurrent_ppo and dreamer both contend for the single gpu slot, so at most one
# of them runs at a time anyway.

resources:
  gpu: 1
  cpu_slot: 20

method_profiles:
  ppo:
    needs:
      cpu_slot: 16
    args:
      method.device: cpu

  recurrent_ppo:
    needs:
      gpu: 1
      cpu_slot: 16
    args:
      method.device: cuda

  dreamer:
    needs:
      gpu: 1
      cpu_slot: 16
    # Dreamer has a known unfixed memory leak (~6-8 KB/env-step in the train
    # process); the scheduler SIGTERMs and re-dispatches at this threshold.
    # See /home/tom/dreamer_crash_summary.md.
    max_ram_gb: 30
    args:
      method.jax.platform: cuda
