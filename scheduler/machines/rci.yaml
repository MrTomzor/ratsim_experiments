# RCI cluster (CTU) — AMD CPU node. **PPO only; no GPU here.**
#
# For dreamer or recurrent_ppo use `--machine rci_gpu` instead: the `amd*`
# partitions map to a[01-16], which have no accelerators at all, so a def
# containing a GPU method will (correctly) fail validation against this file.
#
#   sbatch rci_port_probes/scheduler_job.sbatch <exp>
#   # or by hand, inside a job:
#   export RATSIM_SCHEDULER_MACHINE=rci
#   python scheduler_run.py <exp>
#
# Assumes:
#   --partition=amd --cpus-per-task=112 --mem=200G --nodes=1
# `resources` below must match it. The scheduler spawns children with plain
# subprocess.Popen (no srun), so everything it dispatches lands on the ONE node
# the job holds — asking for more cpu_slot than --cpus-per-task just
# oversubscribes your own cgroup and makes every run slower.
#
# ---------------------------------------------------------------------------
# Sizing rationale — measured, see RCI_CLUSTER_PORT.md §0.56 and §0.9.
#
# `cpu_slot` is counted in THREADS, and a SLURM "CPU" is a thread, not a core.
# The AMD nodes (a01-a16, EPYC 7543, 64c/128t) allow 126 of those 128 to be
# allocated; 112 leaves headroom and divides cleanly into 7 slots of 16.
#
# The binding number is ~4 threads per Unity env. It is a cliff, not a slope —
# same 20k-step PPO run at n_envs=4, only the allocation differing:
#
#     4 threads  ->  17 fps       (2037 s wall)
#     8 threads  -> 251 fps
#    16 threads  -> 688 fps  (Intel) / 723 fps (AMD)
#
# So at the pinned n_envs=4 (set in the experiment def) a run wants 16 threads,
# and 112/16 = 7 concurrent runs. That is verified, not extrapolated: job
# 11318081 ran 7 PPO seeds x 100k steps on node a10, 7/7 clean, each holding
# 593-625 fps against a 723 solo baseline (84%), aggregate 4253 fps = 7.3x a
# single laptop run (581). opt_seconds did not degrade under the packing.
#
# Do NOT try to fit more runs by shrinking needs.cpu_slot. Concurrency on
# *insufficient* cores is much worse than queueing: 4 runs in one 16-thread job
# took 1265 s 4-wide against 339 s 2-wide.
#
# Per-run speed here is roughly the laptop's (723 vs 581). The cluster wins on
# packing 7 of them into one job, not on being a faster computer.
#
# AMD vs Intel: within ~5% at 16 threads. AMD is the right default only because
# its nodes are bigger (126 allocatable threads vs 46 on n01-20 / 70 on n21-32),
# so more runs fit per job. The venvs built on Intel run unmodified on AMD —
# same module tree at /mnt/appl/software, same glibc.
#
# Partition note: the *fast partitions cap at 4h, which suits smoke tests only.
# Real experiments want `amd` (1 day), `amdlong` (3 days) or `amdextralong`
# (21 days) — and since checkpoints currently land only at stage boundaries, a
# run that outlives its wall-clock loses the current stage's progress.
# ---------------------------------------------------------------------------

resources:
  cpu_slot: 112

# How submit.sh turns this config into an sbatch line. Keeping it here is the
# point: `resources.cpu_slot` and `--cpus-per-task` MUST agree (see above), and
# the only way to guarantee that is to derive one from the other rather than
# typing both. `partitions` maps wall-clock tier → partition name; submit.sh
# picks the tier from --time.
sbatch:
  mem: 200G
  partitions:
    fast: amdfast              # 4 h
    day: amd                   # 1 day
    long: amdlong              # 3 days
    extralong: amdextralong    # 21 days

method_profiles:
  ppo:
    needs:
      cpu_slot: 16
    args:
      # CPU beats GPU for a small MLP anyway: per-step host<->device transfer
      # costs more than the forward pass saves.
      method.device: cpu
