# Method comparison: PPO vs Dreamer vs RecurrentPPO on the same maze + task.
#
# Simplest usecase. Single world, single task, no variations.  RecurrentPPO is
# slow + high variance, so we run only 1 seed for it. PPO and Dreamer get 3.
#
# Cardinality: 1 variation × 3 methods × varying seeds = 3 + 3 + 1 = 7 runs.
# Each run is 10 stages of 1M steps (BFS interleave).

agent_preset: sphereagent_2d_lidar
task_preset: volumetric_exploration_4000_collision_penalty
world_preset: cell_grid_households_long

total_steps: 9_000_000
n_stages: 30
mode: dfs

methods:
  - name: dreamer

variations:
  # RAW config keys here (no `method.` prefix) — read by train_dreamerv3.py directly.
  # - {name: bl256_c2, method_args: {batch_length: 256, consec_train: 2}}    # production candidate: 256 window + 512-step continuity
  - {name: consec4,  method_args: {consec_train: 4}}                       # 192-step fresh-carry chains, gradient window still 48
  # - {name: bl256,    method_args: {batch_length: 256}}                     # flagship: window covers a full random→home cycle at low d

seeds: 3
